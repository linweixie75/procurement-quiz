<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body { background: #0d6b66; display: grid; place-items: center; font-family: "Microsoft JhengHei", sans-serif; }
  .box { position: relative; width: 70vw; height: 70vw; display: grid; place-items: center; }
  .ch { color: #fff; font-weight: 700; font-size: 50vw; line-height: 1; transform: translateY(-3vw); }
  .seal { position: absolute; right: -2vw; bottom: -1vw; width: 22vw; height: 22vw; border: 1.6vw solid #ff8a7a; color: #ff8a7a;
          border-radius: 3vw; display: grid; place-items: center; font-size: 14vw; font-weight: 700; transform: rotate(-8deg); background: #0d6b66; }
</style></head>
<body><div class="box"><div class="ch">採</div><div class="seal">題</div></div></body></html>
