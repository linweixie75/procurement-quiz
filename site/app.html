<title>採購法規刷題本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: one narrow column like a printed answer sheet; the question is the hero, controls sit at thumb height. */
:root {
  --bg: #f3f4f1;
  --paper: #ffffff;
  --ink: #1c2730;
  --muted: #5d6a72;
  --line: #d9ddd8;
  --accent: #0d6b66;      /* 政府採購網的青綠 */
  --accent-soft: #e0efed;
  --ok: #1f7a3d;
  --ok-soft: #e3f3e7;
  --bad: #b3261e;          /* 公文朱印 */
  --bad-soft: #fbe7e5;
  --star: #b7791f;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-head: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12181c; --paper: #1b2328; --ink: #e6ebe8; --muted: #9aa7ad; --line: #2e393f;
  --accent: #4fb8ae; --accent-soft: #183632; --ok: #5cc27e; --ok-soft: #173322;
  --bad: #f07a6e; --bad-soft: #3a1d1a; --star: #e3b04b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12181c; --paper: #1b2328; --ink: #e6ebe8; --muted: #9aa7ad; --line: #2e393f;
  --accent: #4fb8ae; --accent-soft: #183632; --ok: #5cc27e; --ok-soft: #173322;
  --bad: #f07a6e; --bad-soft: #3a1d1a; --star: #e3b04b; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--f-head); margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: .02em; }
h2 { font-size: 1.1rem; font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.seal { display: inline-block; border: 2px solid var(--bad); color: var(--bad); font-family: var(--f-head); font-weight: 900;
  font-size: .8rem; padding: 0 6px; border-radius: 4px; transform: rotate(-4deg); margin-left: 6px; vertical-align: middle; }
.sync { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--ok); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.stat { padding: 12px 8px; text-align: center; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: .75rem; color: var(--muted); letter-spacing: .05em; }

/* setup */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: .8rem; color: var(--muted); letter-spacing: .08em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); padding: 6px 12px; border-radius: 999px; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.seg button:disabled { opacity: .4; cursor: default; }
.go { background: var(--accent); color: var(--paper); border: 0; border-radius: 10px; padding: 14px; font-size: 1.05rem; font-weight: 700; }
.go:disabled { opacity: .45; cursor: default; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-weight: 500; }
.resume { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
.resume button { background: var(--accent); color: var(--paper); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; white-space: nowrap; }

/* category table */
.cats { display: flex; flex-direction: column; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.cat:first-child { border-top: 0; }
.cat .nm { min-width: 0; font-weight: 500; }
.cat .ct { font-size: .8rem; color: var(--muted); text-align: right; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--ok); } .bar .r { background: var(--bad); }

/* quiz */
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.qbar button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 0; }
.prog { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.qcard { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); }
.qmeta .tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.qtext { font-size: 1.12rem; line-height: 1.75; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 2rem 1fr; gap: 8px; align-items: start; text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; line-height: 1.6; }
.opt .k { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { color: var(--bad); }
.opts.done .opt { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { grid-template-columns: 1fr; justify-items: center; font-size: 1.1rem; font-weight: 700; padding: 18px 12px; }
.verdict { border-radius: 10px; padding: 10px 12px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict small { font-weight: 400; color: var(--ink); }
.hints { display: flex; flex-wrap: wrap; gap: 8px; }
.hints a { display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--accent); text-decoration: none; font-size: .9rem; }
.memo { display: flex; flex-direction: column; gap: 4px; }
.memo textarea { width: 100%; box-sizing: border-box; font: inherit; line-height: 1.6; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fffbe8; color: var(--ink); resize: vertical; min-height: 4.5em; }
.memo .small { display: flex; justify-content: space-between; }
.memo label.small { color: var(--ink); font-weight: 700; font-size: .95rem; }
.memo div.small { color: var(--ink); opacity: .75; }
.memo textarea { font-size: 1rem; border-color: #d9c98a; }
.memo textarea::placeholder { color: #8a7d55; opacity: 1; }
.note { color: var(--ink); }
.note { background: #fffbe8; border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; font-size: .9rem; }
.qact { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.star { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-weight: 500; }
.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }

/* result & search */
.big { font-family: var(--f-head); font-size: 3rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.item .a { color: var(--ok); font-weight: 700; }
.item ol { margin: 0; padding-left: 1.6em; }
.item li.ans { color: var(--ok); font-weight: 700; }
.search { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
mark { background: var(--accent-soft); color: inherit; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.foot { font-size: .8rem; color: var(--muted); text-align: center; }
.foot button { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 0; font-size: inherit; }
@media (max-width: 420px) { .stat b { font-size: 1.15rem; } h1 { font-size: 1.4rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app">
  <div class="top"><h1>採購法規刷題本</h1></div>
  <p class="muted">正在載入題庫…</p>
</div>

<script id="qdata" type="application/json">__QDATA__</script>
<script>
(() => {
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const MC_KEYS = ['1', '2', '3', '4'];
const TF_LABEL = { O: '○ 正確', X: '✕ 錯誤' };

/* ---------- state ---------- */
let D = null, byId = {};
// prog[qid] = [答對次數, 答錯次數, 最後作答時間, 最後一次是否答對(1/0), 收藏(1/0)]
let prog = LS.get('pq-prog', {});
// notes[qid] = [筆記文字, 最後修改時間]
let notes = LS.get('pq-notes', {});
let setup = LS.get('pq-setup', { cats: [], type: 'all', mode: 'random', size: 20 });
let session = LS.get('pq-session', null);
let view = 'home', searchQ = '', searchCat = -1;
const sync = { on: false, text: '答題紀錄存在這台裝置' };

/* ---------- cloud sync (per-person, private) ---------- */
let db = null, uid = null;
const dirty = new Set(), writing = new Set();
let flushTimer = null;
const shardOf = id => 'p' + id[0];
function markDirty(id) {
  LS.set('pq-prog', prog);
  if (!db) return;
  dirty.add(shardOf(id));
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1200);
}
async function flush() {
  for (const s of [...dirty]) {
    if (writing.has(s)) continue;
    dirty.delete(s); writing.add(s);
    const body = {};
    for (const [id, v] of Object.entries(prog)) if (shardOf(id) === s) body[id] = v;
    try { await db.collection('data/users/' + uid).doc(s).set({ v: body }); }
    catch (e) { dirty.add(s); if (e && e.code === 'invalid_argument') { db = null; setSync(false, '無法寫入雲端，紀錄只存在這台裝置'); } }
    writing.delete(s);
  }
  if (dirty.size && db) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 3000); }
}
/* ---------- backup / restore (move records between devices) ---------- */
let backupMsg = '', pasteOpen = false;
function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
async function packProg() {
  const json = JSON.stringify({ v: 1, prog, notes });
  if (window.CompressionStream) {
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    return 'PQ1:' + b64(new Uint8Array(buf));
  }
  return 'PQ0:' + b64(new TextEncoder().encode(json));
}
async function unpackProg(code) {
  code = code.trim();
  const tag = code.slice(0, 4), body = code.slice(4).replace(/\s+/g, '');
  const u8 = Uint8Array.from(atob(body), c => c.charCodeAt(0));
  let json;
  if (tag === 'PQ1:') json = await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  else if (tag === 'PQ0:') json = new TextDecoder().decode(u8);
  else throw new Error('不是這個工具產生的備份');
  const o = JSON.parse(json);
  if (!o || typeof o.prog !== 'object') throw new Error('備份內容不完整');
  return o;
}
function mergeProg(inc) {
  let n = 0;
  for (const [id, rec] of Object.entries(inc)) {
    if (!Array.isArray(rec) || !byId[id]) continue;
    const m = prog[id];
    if (!m || (rec[2] || 0) > (m[2] || 0)) { prog[id] = rec; n++; if (db) dirty.add(shardOf(id)); }
  }
  LS.set('pq-prog', prog);
  if (db && dirty.size) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500); }
  return n;
}
function mergeNotes(inc) {
  let n = 0;
  for (const [id, rec] of Object.entries(inc)) {
    if (!Array.isArray(rec) || !byId[id]) continue;
    const m = notes[id];
    if (!m || (rec[1] || 0) > (m[1] || 0)) { notes[id] = rec; n++; }
  }
  LS.set('pq-notes', notes);
  return n;
}
async function restoreFrom(text) {
  try { const o = await unpackProg(text); const n = mergeProg(o.prog) + mergeNotes(o.notes || {}); backupMsg = `還原完成，更新了 ${n} 題的紀錄。`; pasteOpen = false; }
  catch (e) { backupMsg = '還原失敗：' + (e.message || '內容看不懂') + '。請確認貼上的是完整的備份碼或備份檔。'; }
  render();
}
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };
async function downloadBackup() {
  const code = await packProg();
  const a = $('a', { href: URL.createObjectURL(new Blob([code], { type: 'text/plain' })), download: `採購刷題備份-${stamp()}.txt` });
  document.body.append(a); a.click(); a.remove();
  backupMsg = '已下載備份檔。到另一台裝置按「從備份檔還原」選這個檔案。'; render();
}
async function copyBackup() {
  const code = await packProg();
  try { await navigator.clipboard.writeText(code); backupMsg = '備份碼已複製。到另一台裝置按「貼上備份碼」貼上。'; }
  catch { backupMsg = '這個瀏覽器不讓網頁複製，請改用「下載備份檔」。'; }
  render();
}
function viewBackup() {
  const answered = Object.keys(prog).length;
  const file = $('input', { type: 'file', id: 'restore-file', accept: '.txt,text/plain', hidden: true,
    onchange: e => { const f = e.target.files[0]; if (f) f.text().then(restoreFrom); } });
  const area = pasteOpen ? $('div', { class: 'field' },
    $('textarea', { id: 'restore-code', class: 'search', rows: 4, placeholder: '把備份碼貼在這裡（PQ1: 開頭）' }),
    $('button', { class: 'go', onclick: () => restoreFrom(document.getElementById('restore-code').value) }, '還原這份紀錄')) : null;
  return $('section', { class: 'panel' },
    $('div', { class: 'top' }, $('h2', {}, '備份與搬移紀錄'), $('span', { class: 'small muted num' }, `目前 ${answered} 題有紀錄`)),
    $('p', { class: 'small muted', style: 'margin:0' }, '答題紀錄只存在這台裝置。換手機、換電腦，或想留一份保險時，先備份，再到另一台裝置還原。兩邊的紀錄會合併，同一題保留比較新的那次。筆記也會一起備份。'),
    $('div', { class: 'row' },
      $('button', { class: 'ghost', onclick: downloadBackup }, '下載備份檔'),
      $('button', { class: 'ghost', onclick: () => file.click() }, '從備份檔還原')),
    $('div', { class: 'row' },
      $('button', { class: 'ghost', onclick: copyBackup }, '複製備份碼'),
      $('button', { class: 'ghost', onclick: () => { pasteOpen = !pasteOpen; backupMsg = ''; render(); } }, pasteOpen ? '收起' : '貼上備份碼')),
    area, file,
    backupMsg ? $('p', { class: 'small', role: 'status', style: 'margin:0' }, backupMsg) : null);
}

function setSync(on, text) { sync.on = on; sync.text = text; const el = document.getElementById('sync'); if (el) el.replaceWith(syncEl()); }
async function connect() {
  if (!window.claude || !claude.use) return;
  const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!d || !u) return;
  uid = await u.id();
  if (!uid) return;
  db = d;
  setSync(false, '正在讀取雲端紀錄…');
  const timer = setTimeout(() => setSync(false, '暫時連不到雲端，先存在這台裝置'), 10000);
  let first = true;
  db.collection('data/users/' + uid).onSnapshot(snap => {
    let changed = false;
    for (const doc of snap.docs) {
      const v = (doc.data() || {}).v || {};
      for (const [id, rec] of Object.entries(v)) {
        const mine = prog[id];
        if (!mine || (rec[2] || 0) > (mine[2] || 0)) { prog[id] = rec; changed = true; }
        else if ((mine[2] || 0) > (rec[2] || 0)) dirty.add(shardOf(id));
      }
    }
    if (first) {
      // 本機有、雲端沒有的紀錄，也上傳
      for (const id of Object.keys(prog)) if (!snap.docs.some(d => d.id === shardOf(id) && (d.data().v || {})[id])) dirty.add(shardOf(id));
      if (dirty.size) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500); }
    }
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync(true, '已同步，手機和電腦共用紀錄'); }
    first = false;
    if (changed) { LS.set('pq-prog', prog); if (view === 'home') render(); }
  }, () => { clearTimeout(timer); db = null; setSync(false, '雲端同步中斷，紀錄先存在這台裝置'); });
}

/* ---------- question helpers ---------- */
const inScope = (q, cats, type) => (!cats.length || cats.includes(q.c)) && (type === 'all' || q.t === type);
const isWrong = q => { const p = prog[q.id]; return p && p[3] === 0; };
const isStar = q => { const p = prog[q.id]; return p && p[4] === 1; };
const isNew = q => !prog[q.id] || (prog[q.id][0] + prog[q.id][1]) === 0;
function pool(s = setup) {
  let qs = D.qs.filter(q => inScope(q, s.cats, s.type));
  if (s.mode === 'new') qs = qs.filter(isNew);
  if (s.mode === 'wrong') qs = qs.filter(isWrong);
  if (s.mode === 'star') qs = qs.filter(isStar);
  return qs;
}
function startSession(ids, label) {
  session = { ids, i: 0, label, ans: {} };
  LS.set('pq-session', session);
  view = 'quiz'; render(); scrollTo(0, 0);
}
function startFromSetup() {
  let qs = pool();
  if (setup.mode === 'random' || setup.mode === 'wrong' || setup.mode === 'star') qs = shuffle(qs.slice());
  if (setup.size) qs = qs.slice(0, setup.size);
  const modeName = { random: '隨機', new: '沒做過的', wrong: '錯題', star: '收藏' }[setup.mode];
  const scope = setup.cats.length === 1 ? D.cats[setup.cats[0]] : setup.cats.length ? `${setup.cats.length} 個類別` : '全部類別';
  startSession(qs.map(q => q.id), `${scope}・${modeName}`);
}
function answer(q, choice) {
  if (session.ans[q.id] != null) return;
  const ok = choice === q.a;
  session.ans[q.id] = choice;
  const p = prog[q.id] ? prog[q.id].slice() : [0, 0, 0, 0, 0];
  p[ok ? 0 : 1]++; p[2] = Date.now(); p[3] = ok ? 1 : 0;
  prog[q.id] = p;
  LS.set('pq-session', session);
  markDirty(q.id);
  render();
}
function toggleStar(q) {
  const p = prog[q.id] ? prog[q.id].slice() : [0, 0, 0, -1, 0];
  p[4] = p[4] ? 0 : 1; p[2] = Date.now();
  prog[q.id] = p; markDirty(q.id); render();
}
function next() {
  if (session.i < session.ids.length - 1) { session.i++; LS.set('pq-session', session); render(); scrollTo(0, 0); }
  else { view = 'result'; render(); scrollTo(0, 0); }
}

/* ---------- hints & notes ---------- */
const gUrl = text => 'https://www.google.com/search?q=' + encodeURIComponent(text);
function hintsEl(q) {
  const stem = q.q.replace(/\s+/g, ' ').replace(/[，。、；：？！（）()「」]/g, ' ').trim().slice(0, 40);
  return $('div', { class: 'hints' },
    $('a', { href: gUrl('政府採購法 ' + stem), target: '_blank', rel: 'noopener' }, '🔍 Google 搜尋這題'),
    q.l ? $('a', { href: gUrl(q.l), target: '_blank', rel: 'noopener' }, `📖 查法條：${q.l.length > 16 ? q.l.slice(0, 16) + '…' : q.l}`) : null);
}
function memoEl(q) {
  const cur = notes[q.id] ? notes[q.id][0] : '';
  const status = $('span', {}, cur ? '已儲存' : '打字會自動儲存');
  let t = null;
  const ta = $('textarea', { id: 'memo', rows: 3, placeholder: '寫下自己的筆記、記憶口訣…',
    oninput: e => {
      status.textContent = '儲存中…'; clearTimeout(t);
      const v = e.target.value;
      t = setTimeout(() => {
        if (v.trim()) notes[q.id] = [v, Date.now()]; else delete notes[q.id];
        LS.set('pq-notes', notes); status.textContent = v.trim() ? '已儲存' : '打字會自動儲存';
      }, 400);
    } }, cur);
  return $('div', { class: 'memo' }, $('label', { for: 'memo', class: 'small muted' }, '📝 我的筆記'), ta, $('div', { class: 'small muted' }, status));
}

/* ---------- views ---------- */
const syncEl = () => $('div', { class: 'sync', id: 'sync' }, $('i', { class: 'dot' + (sync.on ? ' on' : '') }), sync.text);

function viewHome() {
  const all = D.qs, done = all.filter(q => !isNew(q));
  const right = done.reduce((s, q) => s + prog[q.id][0], 0), tot = done.reduce((s, q) => s + prog[q.id][0] + prog[q.id][1], 0);
  const wrongN = all.filter(isWrong).length, starN = all.filter(isStar).length;
  const avail = pool().length;
  const want = setup.size ? Math.min(setup.size, avail) : avail;

  const seg = (key, opts) => $('div', { class: 'seg', role: 'group' }, opts.map(([v, txt, n]) =>
    $('button', { 'aria-pressed': String(setup[key] === v), disabled: n === 0,
      onclick: () => { setup[key] = v; LS.set('pq-setup', setup); render(); } }, n != null ? `${txt} ${n}` : txt)));
  const scopeQs = D.qs.filter(q => inScope(q, setup.cats, setup.type));

  const catBtns = $('div', { class: 'seg', role: 'group' },
    $('button', { 'aria-pressed': String(!setup.cats.length), onclick: () => { setup.cats = []; LS.set('pq-setup', setup); render(); } }, '全部'),
    D.cats.map((c, i) => $('button', { 'aria-pressed': String(setup.cats.includes(i)),
      onclick: () => { const s = new Set(setup.cats); s.has(i) ? s.delete(i) : s.add(i); setup.cats = [...s].sort((a, b) => a - b); LS.set('pq-setup', setup); render(); } }, c)));

  const resume = session && view === 'home' && session.i < session.ids.length && Object.keys(session.ans).length < session.ids.length
    ? $('div', { class: 'resume' },
        $('div', {}, $('div', {}, $('b', {}, '繼續上次練習')), $('div', { class: 'small muted' }, `${session.label}・第 ${session.i + 1} / ${session.ids.length} 題`)),
        $('button', { onclick: () => { view = 'quiz'; render(); } }, '繼續'))
    : null;

  const cats = $('div', { class: 'cats' }, D.cats.map((c, i) => {
    const qs = all.filter(q => q.c === i);
    const g = qs.filter(q => prog[q.id] && prog[q.id][3] === 1).length;
    const r = qs.filter(isWrong).length;
    return $('button', { class: 'cat', title: '只練這一類', onclick: () => { setup.cats = [i]; LS.set('pq-setup', setup); render(); scrollTo({ top: 0, behavior: 'smooth' }); } },
      $('span', { class: 'nm' }, c), $('span', { class: 'ct num' }, `${g + r} / ${qs.length}`),
      $('span', { class: 'bar' }, $('i', { class: 'g', style: `width:${g / qs.length * 100}%` }), $('i', { class: 'r', style: `width:${r / qs.length * 100}%` })));
  }));

  return [
    $('div', { class: 'top' }, $('h1', {}, '採購法規刷題本'), syncEl()),
    $('div', { class: 'stats' },
      $('div', { class: 'stat' }, $('b', {}, done.length), $('span', {}, `已做 / ${all.length}`)),
      $('div', { class: 'stat' }, $('b', {}, tot ? pct(right, tot) + '%' : '—'), $('span', {}, '正確率')),
      $('div', { class: 'stat' }, $('b', {}, wrongN), $('span', {}, '錯題')),
      $('div', { class: 'stat' }, $('b', {}, starN), $('span', {}, '收藏'))),
    resume,
    $('section', { class: 'panel' },
      $('h2', {}, '開始練習'),
      $('div', { class: 'field' }, $('span', { class: 'label' }, '範圍'), catBtns),
      $('div', { class: 'field' }, $('span', { class: 'label' }, '題型'),
        seg('type', [['all', '全部'], ['mc', '選擇題'], ['tf', '是非題']])),
      $('div', { class: 'field' }, $('span', { class: 'label' }, '出題方式'),
        seg('mode', [['random', '隨機', scopeQs.length], ['new', '依序做沒做過的', scopeQs.filter(isNew).length],
                     ['wrong', '錯題', scopeQs.filter(isWrong).length], ['star', '收藏', scopeQs.filter(isStar).length]])),
      $('div', { class: 'field' }, $('span', { class: 'label' }, '題數'),
        seg('size', [[10, '10 題'], [20, '20 題'], [50, '50 題'], [0, '全部']])),
      $('button', { class: 'go', disabled: !avail, onclick: startFromSetup }, avail ? `開始 ${want} 題` : '這個範圍沒有題目')),
    $('section', { class: 'panel' },
      $('div', { class: 'top' }, $('h2', {}, '各類別進度'), $('span', { class: 'small muted' }, '綠＝最後一次答對　紅＝錯題')),
      cats),
    $('button', { class: 'ghost', onclick: () => { view = 'search'; render(); scrollTo(0, 0); } }, '查詢題目與答案'),
    viewBackup(),
    $('p', { class: 'foot' }, `題庫來源：政府電子採購網「採購法規題庫」，資料日期 ${D.date}，共 ${D.qs.length} 題。`),
  ];
}

function viewQuiz() {
  const q = byId[session.ids[session.i]];
  if (!q) { view = 'home'; return viewHome(); }
  const chosen = session.ans[q.id];
  const answered = chosen != null;
  const p = prog[q.id];
  const n = session.ids.length, doneN = Object.keys(session.ans).length;
  const right = session.ids.filter(id => session.ans[id] != null && session.ans[id] === byId[id].a).length;

  const cls = k => !answered ? 'opt' : k === q.a ? 'opt right' : k === chosen ? 'opt wrong' : 'opt';
  const opts = q.t === 'mc'
    ? $('div', { class: 'opts' + (answered ? ' done' : '') }, q.o.map((o, i) =>
        $('button', { class: cls(MC_KEYS[i]), onclick: () => answer(q, MC_KEYS[i]) }, $('span', { class: 'k' }, `(${i + 1})`), $('span', {}, o))))
    : $('div', { class: 'opts tf' + (answered ? ' done' : '') }, ['O', 'X'].map(k =>
        $('button', { class: cls(k), onclick: () => answer(q, k) }, TF_LABEL[k])));

  let verdict = null;
  if (answered) {
    const ok = chosen === q.a;
    const ansTxt = q.t === 'mc' ? `正確答案是 (${q.a})` : `正確答案是「${TF_LABEL[q.a].slice(2)}」`;
    const hist = p ? `這題累計答對 ${p[0]} 次、答錯 ${p[1]} 次` : '';
    verdict = $('div', { class: 'verdict ' + (ok ? 'ok' : 'bad') }, ok ? '答對了' : `答錯了，${ansTxt}`,
      q.l ? $('small', {}, `依據法源：${q.l}`) : null, $('small', { class: 'muted' }, hist));
  }

  return [
    $('div', { class: 'qbar' },
      $('button', { onclick: () => { view = 'home'; render(); scrollTo(0, 0); } }, '‹ 回首頁'),
      $('span', { class: 'small num' }, `第 ${session.i + 1} / ${n} 題`),
      $('span', { class: 'small num muted' }, `答對 ${right} / ${doneN}`)),
    $('div', { class: 'prog' }, $('i', { style: `width:${(session.i + (answered ? 1 : 0)) / n * 100}%` })),
    $('article', { class: 'qcard' },
      $('div', { class: 'qmeta' }, $('span', {}, D.cats[q.c]), $('span', { class: 'tag' }, `${q.t === 'mc' ? '選擇' : '是非'} #${q.n}`)),
      $('p', { class: 'qtext' }, q.q),
      opts, verdict,
      answered && chosen !== q.a ? hintsEl(q) : null,
      answered ? memoEl(q) : null),
    $('div', { class: 'qact' },
      $('button', { class: 'star', 'aria-pressed': String(isStar(q)), onclick: () => toggleStar(q) }, isStar(q) ? '★ 已收藏' : '☆ 收藏'),
      answered ? $('button', { class: 'go', onclick: next }, session.i < n - 1 ? '下一題' : '看結果')
               : $('button', { class: 'ghost', onclick: next }, '略過')),
    $('p', { class: 'foot' }, '鍵盤：1–4 或 O / X 作答，Enter 下一題'),
  ];
}

function viewResult() {
  const ids = session.ids, ans = session.ans;
  const doneIds = ids.filter(id => ans[id] != null);
  const wrong = doneIds.filter(id => ans[id] !== byId[id].a);
  const right = doneIds.length - wrong.length;
  return [
    $('div', { class: 'top' }, $('h1', {}, '這回練習結果'), $('span', { class: 'small muted' }, session.label)),
    $('section', { class: 'panel' },
      $('div', { class: 'big' }, `${right} / ${doneIds.length}`),
      $('div', { class: 'muted' }, `正確率 ${pct(right, doneIds.length)}%` + (ids.length > doneIds.length ? `，略過 ${ids.length - doneIds.length} 題` : '')),
      $('div', { class: 'row' },
        wrong.length ? $('button', { class: 'go', onclick: () => startSession(shuffle(wrong.slice()), '這回答錯的題目') }, `重做答錯的 ${wrong.length} 題`) : null,
        $('button', { class: 'ghost', onclick: () => { session = null; LS.set('pq-session', null); view = 'home'; render(); scrollTo(0, 0); } }, '回首頁'))),
    wrong.length ? $('h2', {}, '答錯的題目') : null,
    $('div', { class: 'list' }, wrong.map(id => itemEl(byId[id], '', true))),
  ];
}

function hl(text, term) {
  if (!term) return [text];
  const out = []; let i = 0, j;
  while ((j = text.indexOf(term, i)) !== -1) { out.push(text.slice(i, j), $('mark', {}, term)); i = j + term.length; }
  out.push(text.slice(i)); return out;
}
function itemEl(q, term = '', withHints = false) {
  return $('div', { class: 'item' },
    $('div', { class: 'qmeta' }, $('span', {}, D.cats[q.c]), $('span', { class: 'tag' }, `${q.t === 'mc' ? '選擇' : '是非'} #${q.n}`)),
    $('div', {}, hl(q.q, term)),
    q.t === 'mc'
      ? $('ol', {}, q.o.map((o, i) => $('li', { class: MC_KEYS[i] === q.a ? 'ans' : null }, hl(o, term))))
      : $('div', { class: 'a' }, `答案：${TF_LABEL[q.a]}`),
    q.l ? $('div', { class: 'small muted' }, `依據法源：${q.l}`) : null,
    notes[q.id] ? $('div', { class: 'note' }, '📝 ', hl(notes[q.id][0], term)) : null,
    withHints ? hintsEl(q) : null);
}

function viewSearch() {
  const term = searchQ.trim();
  let hits = [];
  if (term) hits = D.qs.filter(q => (searchCat < 0 || q.c === searchCat) && (q.q.includes(term) || (q.o && q.o.some(o => o.includes(term))) || (notes[q.id] && notes[q.id][0].includes(term))));
  const input = $('input', { class: 'search', id: 'search-q', type: 'search', placeholder: '輸入關鍵字，例如：押標金、統包、第22條', value: searchQ,
    oninput: e => { searchQ = e.target.value; clearTimeout(viewSearch.t); viewSearch.t = setTimeout(() => { render(); const el = document.getElementById('search-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); } });
  const sel = $('select', { class: 'search', id: 'search-cat', onchange: e => { searchCat = +e.target.value; render(); } },
    $('option', { value: '-1' }, '全部類別'), D.cats.map((c, i) => $('option', { value: i, selected: i === searchCat }, c)));
  return [
    $('div', { class: 'qbar' }, $('button', { onclick: () => { view = 'home'; render(); scrollTo(0, 0); } }, '‹ 回首頁'), $('span', {}, '查詢題目'), $('span', {})),
    input, sel,
    term ? $('p', { class: 'small muted' }, hits.length ? `找到 ${hits.length} 題` + (hits.length > 60 ? '，先顯示前 60 題' : '') : '找不到符合的題目') : null,
    $('div', { class: 'list' }, hits.slice(0, 60).map(q => itemEl(q, term))),
  ];
}

function render() {
  const app = document.getElementById('app');
  const v = view === 'quiz' && session ? viewQuiz() : view === 'result' && session ? viewResult() : view === 'search' ? viewSearch() : (view = 'home', viewHome());
  app.replaceChildren(...v.flat().filter(Boolean));
}

document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !session || (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const q = byId[session.ids[session.i]];
  const k = e.key.toUpperCase();
  if (session.ans[q.id] == null) {
    if (q.t === 'mc' && MC_KEYS.includes(k)) answer(q, k);
    if (q.t === 'tf' && (k === 'O' || k === 'X')) answer(q, k);
  } else if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
});

function fail(stage, e) {
  document.getElementById('app').replaceChildren($('h1', {}, '採購法規刷題本'),
    $('p', {}, `${stage}失敗。請把下面這行錯誤訊息告訴 Claude：`),
    $('pre', { style: 'white-space:pre-wrap;font-size:.8rem' }, String(e && (e.stack || e.message) || e)));
}
let d;
try { d = JSON.parse(document.getElementById('qdata').textContent); }
catch (e) { fail('讀取題庫', e); return; }
D = d; for (const q of d.qs) byId[q.id] = q;
try {
  setup.cats = (Array.isArray(setup.cats) ? setup.cats : []).filter(i => i < d.cats.length);
  if (session && Array.isArray(session.ids)) session.ids = session.ids.filter(id => byId[id]); else session = null;
  render();
} catch (e) {
  // 舊的本機狀態可能壞掉：清掉再試一次
  session = null; setup = { cats: [], type: 'all', mode: 'random', size: 20 }; view = 'home';
  try { render(); } catch (e2) { fail('顯示畫面', e2); return; }
}
connect().catch(() => {});
// 請瀏覽器不要自動清掉答題紀錄（iPhone 加入主畫面後最穩）
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch {}
})();
</script>
